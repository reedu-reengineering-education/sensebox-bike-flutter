name: Build APK

on:
  issue_comment:
    types: [created]

concurrency:
  group: build-apk-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
    env:
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      KEYSTORE_FILE: release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/build-apk') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Reject fork pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const headRepo = pullRequest.head.repo && pullRequest.head.repo.full_name;
            if (headRepo !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Refusing to sign an APK from a fork pull request.');
            }

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: "3.47.9"

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore file
        if: env.KEYSTORE_PASSWORD != ''
        run: |
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 -d > ${{ github.workspace }}/android/app/release.keystore

      - name: Create key.properties file
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > ${{ github.workspace }}/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> ${{ github.workspace }}/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> ${{ github.workspace }}/android/key.properties
          echo "storeFile=${{ github.workspace }}/android/app/release.keystore" >> ${{ github.workspace }}/android/key.properties

      - name: Create .env file
        run: |
          echo "MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}" > .env
          echo "SENTRY_DSN=${SENTRY_DSN}" >> .env

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Reply to /build-apk comment with APK link
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          comment-id: ${{ github.event.comment.id }}
          body: |
            The APK is attached to this workflow run as the `app-release-apk` artifact: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  reject-untrusted:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/build-apk') &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Reply that the command is limited to collaborators
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: Only organization members and collaborators can run `/build-apk`.
