name: Analyze

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: flutter-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: "3.47.9"

      # Infos and warnings stay in the log. The job fails only on errors.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
