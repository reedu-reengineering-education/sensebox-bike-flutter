name: Analyze

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: flutter-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: "3.47.9"

      # Infos are mostly framework deprecations already in the tree.
      # Warnings and errors still fail the job.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: "3.47.9"

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
